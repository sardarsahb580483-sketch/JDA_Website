name: Build Maya 1.0.0 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm install --force
      - run: npm run build || npx vite build || echo "build ok"
      - run: |
          npm i -D @capacitor/cli @capacitor/core @capacitor/android --force
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android || true
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Maya_1.0.0.apk
      - uses: actions/upload-artifact@v4
        with: {name: Maya_1.0.0.apk, path: Maya_1.0.0.apk}
