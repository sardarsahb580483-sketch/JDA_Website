<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS CHAT - JAD JI</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}.header{background:#25D366;padding:12px;text-align:center;font-weight:900;color:#000;font-size:18px}.search{margin:8px;background:#111;border-radius:20px;padding:10px 15px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.slider{width:95%;height:140px;margin:8px auto;border-radius:15px;background:linear-gradient(45deg,#0a2a1a,#25D366);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;animation:color 3s infinite}@keyframes color{0%{background:linear-gradient(45deg,#0a2a1a,#25D366)}50%{background:linear-gradient(45deg,#1a0a2a,#E91E63)}100%{background:linear-gradient(45deg,#0a2a1a,#25D366)}}.future{margin:8px;background:#111;padding:10px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.future div{background:#222;padding:8px;border-radius:8px;text-align:center;font-size:11px;border:1px solid #25D366}.chat{flex:1;overflow-y:auto;padding:10px;background:#0b141a}.msg{max-width:80%;padding:10px;border-radius:12px;margin:6px 0;font-size:13px}.user{background:#005c4b;margin-left:auto;color:#fff}.jarvis{background:#202c33;margin-right:auto;color:#fff}.bottom{background:#111;padding:10px;display:flex;gap:8px}.bottom input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff;outline:none}.bottom button{width:45px;height:45px;border-radius:50%;border:none;background:#25D366;color:#fff;font-size:18px}</style></head><body>
<div class="header">💬 JAD JI - JARVIS CHAT SYSTEM</div>
<div class="search">🔍 <input id="sInput" placeholder="سرچ کرو..." onkeyup="doSearch(this.value)"><span onclick="doMic()">🎤</span></div>
<div class="slider" id="slider">🖼️ تصویر بدل رہی ہے - 1</div>
<div class="future">
<div>🤖 AI CHAT<br><b style="color:#25D366">ON</b></div>
<div>❤️ 300 React<br><b id="rc" style="color:#25D366">0/300</b></div>
<div>🎤 Voice<br><b style="color:#25D366">ON</b></div>
<div>🔍 Search<br><b style="color:#25D366">ON</b></div>
<div>🖼️ Auto Pic<br><b style="color:#25D366">ON</b></div>
<div>💬 12k Follow<br><b style="color:#25D366">ON</b></div>
</div>
<div class="chat" id="chat"><div class="msg jarvis">السلام علیکم جاد جی! 💚 میں JARVIS ہوں - بولو کیا کرنا ہے؟ یہ چیٹ سسٹم اب سب کچھ کرے گا!</div></div>
<div class="bottom"><button onclick="doMic()" id="mic">🎤</button><input id="txt" placeholder="میسج لکھو جاد جی..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
<script>
let msgs=[], cnt=0, isMic=false, rec=null;
function add(w,t){let c=document.getElementById('chat'); let d=document.createElement('div'); d.className='msg '+w; d.innerHTML=t; c.appendChild(d); c.scrollTop=c.scrollHeight; msgs.push(t); let utt=new SpeechSynthesisUtterance(t); utt.lang='ur-PK'; if(w=='jarvis' && isMic) speechSynthesis.speak(utt);}
function send(){let i=document.getElementById('txt'), t=i.value.trim(); if(!t) return; add('user',t); i.value=''; setTimeout(()=>{handle(t)},500);}
function handle(t){let l=t.toLowerCase(); if(l.includes('سلام')) add('jarvis','وعلیکم السلام جاد جی! 💚 حکم کریں - سب سسٹم ON ہے'); else if(l.includes('چینل')||l.includes('channel')) add('jarvis','جی جاد جی - آپ کا چینل 12k پر ہے - <a href="https://whatsapp.com/channel/0029VbCvfKrFsn0dUvrCai2d" target="_blank" style="color:#25D366">کھولو</a>'); else if(l.includes('ری ایکٹ')||l.includes('react')) add('jarvis','❤️ ری ایکٹ '+cnt+'/300 ہو گئے جاد جی'); else if(l.includes('تصویر')||l.includes('pic')) add('jarvis','🖼️ اوپر تصویر بدل رہی ہے جاد جی - ہر 3 سیکنڈ میں'); else add('jarvis','جی جاد جی، میں نے سن لیا: "'+t+'" - اب یہ چیٹ سسٹم کام کر رہا ہے! اور کیا کرنا ہے؟');}
function doSearch(v){document.querySelectorAll('.msg').forEach(m=>{m.style.display=!v||m.innerText.toLowerCase().includes(v.toLowerCase())?'block':'none'});}
let sNo=1; setInterval(()=>{sNo++; document.getElementById('slider').innerText='🖼️ تصویر بدل رہی ہے - '+sNo;},3000);
setInterval(()=>{if(cnt<300){cnt+=2; document.getElementById('rc').innerText=cnt+'/300';}},1500);
function doMic(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Chrome کھولو جاد جی'); return} if(!isMic){isMic=true; document.getElementById('mic').innerText='🔴'; rec=new SR(); rec.lang='ur-PK'; rec.continuous=true; rec.onresult=(e)=>{let f=''; for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) f+=e.results[i][0].transcript; if(f){add('user',f); handle(f);}}; rec.onend=()=>{if(isMic) try{rec.start()}catch{}}; rec.start(); add('jarvis','🎤 مائیک ON ہو گیا جاد جی - اب بولو، سب کچھ کرے گا');} else {isMic=false; if(rec) rec.stop(); document.getElementById('mic').innerText='🎤'; add('jarvis','مائیک OFF');}}
</script></body></html>
