<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>JARVIS TOWER - JAM DANISH | TechGPTX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#00E5FF;font-family:monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.stars{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#0a1a2a 0%,#000 100%);z-index:-1}.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#00E5FF,#004466,#000);box-shadow:0 0 60px #00E5FF, inset 0 0 40px #00E5FF44;animation:float 3s ease-in-out infinite;position:relative;transition:0.5s}.orb.listening{box-shadow:0 0 100px #00E5FF,0 0 160px #00E5FF88;transform:scale(1.1)}.orb.speaking{animation:speak 0.3s infinite alternate;box-shadow:0 0 100px #00FF88,0 0 160px #00FF88}.orb.connecting{animation:spin 1s linear infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}@keyframes speak{0%{transform:scale(1)}100%{transform:scale(1.15)}}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.title{position:absolute;top:20px;left:50%;transform:translateX(-50%);letter-spacing:4px;font-size:13px}.status{margin-top:30px;font-size:18px;letter-spacing:3px;text-shadow:0 0 10px #00E5FF}.power{margin-top:25px;width:80px;height:80px;border-radius:50%;background:#111;border:2px solid #00E5FF;color:#00E5FF;font-size:32px;cursor:pointer;box-shadow:0 0 20px #00E5FF55}.power.on{background:#00E5FF;color:#000;box-shadow:0 0 40px #00E5FF}.settings{position:absolute;top:20px;right:20px;background:#111;border:1px solid #00E5FF33;padding:10px;border-radius:10px;width:280px;display:none}.settings.show{display:block}.settings input{width:100%;padding:8px;margin:6px 0;background:#000;border:1px solid #00E5FF55;color:#fff;border-radius:6px}.chat{position:absolute;bottom:100px;width:90%;max-width:600px;max-height:200px;overflow-y:auto;text-align:left;padding:10px;font-size:12px;color:#aaa}.btn-wa{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:800;font-size:12px}</style></head><body>
<div class="stars"></div>
<div class="title">TechGPTX | JARVIS TOWER - JAM DANISH</div>
<div style="position:absolute;top:20px;right:20px;cursor:pointer" onclick="document.getElementById('set').classList.toggle('show')">⚙️</div>

<div class="settings" id="set">
<div style="font-weight:900;margin-bottom:8px">JARVIS Settings</div>
<input id="apiKey" placeholder="Gemini API Key (AIza...)"><input id="bossName" placeholder="Boss Name - JAD JI"><button onclick="saveSet()" style="width:100%;padding:8px;background:#00E5FF;border:none;border-radius:6px;font-weight:900;margin-top:6px">SAVE</button>
<div style="font-size:9px;margin-top:6px;color:#666">Get key: aistudio.google.com/apikey</div>
</div>

<div class="orb" id="orb"></div>
<div class="status" id="status">IDLE</div>
<button class="power" id="powerBtn" onclick="toggleJarvis()">⏻</button>
<div style="margin-top:10px;font-size:11px;color:#666" id="micInfo">Click Power to Start Tower</div>

<div class="chat" id="chat"></div>
<a href="https://whatsapp.com/channel/0029VbCvfKrFsn0dUvrCai2d" target="_blank" class="btn-wa">💬 WhatsApp Channel - 12k</a>

<script>
let isOn=false, rec=null, synth=window.speechSynthesis, bossName=localStorage.getItem('boss')||'Boss', apiKey=localStorage.getItem('gemini_key')||'';
document.getElementById('bossName').value=bossName; document.getElementById('apiKey').value=apiKey;
function saveSet(){bossName=document.getElementById('bossName').value||'Boss'; apiKey=document.getElementById('apiKey').value; localStorage.setItem('boss',bossName); localStorage.setItem('gemini_key',apiKey); document.getElementById('set').classList.remove('show'); addChat('System','Settings Saved - Boss: '+bossName,'#00E5FF')}
function addChat(who,text,color){let c=document.getElementById('chat'); c.innerHTML+=`<div style="margin:6px 0;color:${color}"><b>${who}:</b> ${text}</div>`; c.scrollTop=c.scrollHeight;}
function speak(text){let orb=document.getElementById('orb'), status=document.getElementById('status'); orb.className='orb speaking'; status.innerText='SPEAKING...'; let u=new SpeechSynthesisUtterance(text); u.rate=1; u.pitch=0.9; u.onend=()=>{orb.className='orb listening'; status.innerText='LISTENING...'; if(isOn) try{rec.start()}catch{}}; synth.speak(u); addChat('JARVIS',text,'#00FF88')}
function toggleJarvis(){if(!isOn){startTower()}else{stopTower()}}
function startTower(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Chrome use karo Jad ji'); return}
isOn=true; document.getElementById('powerBtn').classList.add('on'); document.getElementById('orb').className='orb listening'; document.getElementById('status').innerText='LISTENING...'; document.getElementById('micInfo').innerText='🔴 Tower ON - Bolo Jad ji...'; addChat('System','Tower Online - Hello '+bossName+'...','00E5FF');
rec=new SR(); rec.lang='en-US'; rec.continuous=false; rec.interimResults=false;
rec.onresult=(e)=>{let text=e.results[0][0].transcript; addChat(bossName,text,'#fff'); handleCommand(text)};
rec.onend=()=>{if(isOn){setTimeout(()=>{try{rec.start()}catch{}},800)}};
rec.onerror=()=>{if(isOn){setTimeout(()=>{try{rec.start()}catch{}},1000)}};
rec.start();
}
function stopTower(){isOn=false; if(rec) rec.stop(); synth.cancel(); document.getElementById('powerBtn').classList.remove('on'); document.getElementById('orb').className='orb'; document.getElementById('status').innerText='IDLE'; document.getElementById('micInfo').innerText='Tower OFF'; addChat('System','Tower Offline','red')}
function handleCommand(t){
let low=t.toLowerCase(); document.getElementById('orb').className='orb connecting'; document.getElementById('status').innerText='THINKING...';
if(low.includes('channel')||low.includes('whatsapp')){speak(`Opening your WhatsApp channel, ${bossName}`); window.open('https://whatsapp.com/channel/0029VbCvfKrFsn0dUvrCai2d','_blank')}
else if(low.includes('time')){speak(`It is ${new Date().toLocaleTimeString()}, ${bossName}`)}
else if(low.includes('who are you')){speak(`I am JARVIS, your tower system created by TechGPTX and JAM DANISH, at your service ${bossName}`)}
else if(low.includes('react')||low.includes('follower')){speak(`Your channel has 12 thousand followers and 300 auto reacts are active, ${bossName}`)}
else if(low.includes('stop')||low.includes('band')||low.includes('off')){speak(`Shutting down tower, Goodbye ${bossName}`); setTimeout(stopTower,1500)}
else{
let reply=`Yes ${bossName}, I heard ${t}. Your tower system is fully operational. All features are active.`;
if(apiKey){reply=`Processing ${t}, Boss. System is online.`}
speak(reply);
}
}
</script></body></html>
