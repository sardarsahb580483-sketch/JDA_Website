<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Maya - Mic Always ON - JAD JI</title><style>body{margin:0;background:#000;display:flex;justify-content:center;font-family:system-ui}.phone{width:100%;max-width:390px;background:linear-gradient(180deg,#141a2e,#0a0e1a);min-height:100vh;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px #00E5FF77}.header{display:flex;justify-content:space-between;padding:14px 16px;color:#fff}.greet{padding:0 18px 6px;color:#fff}.greet h1{font-size:22px;font-weight:800}.avatar{position:relative;width:100%;height:380px;background:#000}.avatar img{width:100%;height:100%;object-fit:cover}.live{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:6px 14px;border-radius:20px;font-size:11px;color:#fff;border:1px solid #ffffff22;display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;background:#00FF88;border-radius:50%;animation:blink 1s infinite}.dot.speak{background:#00E5FF}.tabs{display:flex;gap:8px;padding:10px 16px}.tab{flex:1;background:#1e263f;border:1px solid #2a3658;padding:9px;border-radius:14px;text-align:center;font-size:12px;color:#cbd5e1}.tab.active{background:#00E5FF22;border-color:#00E5FF;color:#00E5FF}.panel{display:none;padding:10px 16px;background:#0f1424;max-height:240px;overflow:auto}.panel.show{display:block}.item{padding:8px;background:#1e263f;border-radius:10px;margin:6px 0;color:#fff;font-size:12px;display:flex;justify-content:space-between}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 10px}.card{background:#1a2138;border:1px solid #2a3658;border-radius:16px;padding:10px;color:#fff}.ask{display:flex;gap:8px;padding:10px 16px;background:#0f1424}.ask input{flex:1;padding:12px 14px;border-radius:24px;border:1px solid #2a3658;background:#1e263f;color:#fff;outline:none}.micWrap{display:flex;justify-content:center;padding:10px;background:#0f1424}.micBtn{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ff0055,#ff8a00);border:none;color:#fff;font-size:28px;box-shadow:0 0 30px #ff005588;animation:pulse 1s infinite}.micBtn.off{background:#1e263f;animation:none;box-shadow:none}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}.pop{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:70px;animation:pop 0.7s;z-index:20}@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
</style></head><body>
<div class="phone">
<div class="header"><b>Maya</b><div>⚡ <span id="en">∞</span> Energy</div></div>
<div class="greet"><h1 id="gr">Good evening,<br>JAD JI</h1><p id="st">🔴 Mic Always ON - سن رہی ہوں</p></div>
<div class="avatar" id="av"><img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600&h=800&fit=crop&crop=face"><div class="live"><div class="dot" id="dot"></div><span id="live">Always Listening...</span></div></div>
<div class="tabs"><div class="tab active">🎵 Music</div><div class="tab">📚 Study</div><div class="tab">📝 Journal</div></div>
<div class="panel show" id="p-all"><div id="list"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="inp" placeholder="ٹاسک / گانا / دل کی بات لکھو..." style="flex:1;padding:8px 12px;border-radius:20px;border:1px solid #2a3658;background:#1a2138;color:#fff;outline:none"><button onclick="add()" style="padding:8px 14px;border-radius:20px;background:#00E5FF;border:none;font-weight:800">Add</button></div></div>
<div class="cards"><div class="card" onclick="speak('موسم 29 ڈگری ہے جاد جی')"><small>⛅ Weather</small><b style="font-size:20px">29°</b></div><div class="card"><small>📅 Tasks</small><b style="font-size:20px" id="tc">0</b></div><div class="card" onclick="changeMood()"><small>😊 Mood</small><b id="mood">Happy</b></div></div>
<div class="ask"><input id="txt" placeholder="Ask Maya..."><button onclick="send()" style="background:none;border:none;color:#00E5FF;font-size:20px">➤</button></div>
<div class="micWrap"><button class="micBtn" id="mic">🎤</button></div>
</div>
<script>
let rec=null, isOn=true, boss='JAD JI', studys=JSON.parse(localStorage.getItem('maya_s')||'[]');
function render(){document.getElementById('list').innerHTML=studys.map((t,i)=>`<div class="item">${t} <span onclick="del(${i})">❌</span></div>`).join('');document.getElementById('tc').innerText=studys.length;}
render();
function pop(e){let d=document.createElement('div');d.className='pop';d.innerText=e;document.getElementById('av').appendChild(d);setTimeout(()=>d.remove(),1500);}
function speak(t){
 document.getElementById('st').innerText='Speaking...';document.getElementById('live').innerText='Speaking...';document.getElementById('dot').classList.add('speak');
 let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=0.95;u.pitch=1.15;
 u.onend=()=>{document.getElementById('st').innerText='🔴 Always ON - سن رہی ہوں';document.getElementById('live').innerText='Always Listening...';document.getElementById('dot').classList.remove('speak');restartMic();};
 speechSynthesis.speak(u);
}
function logic(l){
 if(l.includes('pyar')||l.includes('door')){pop('😡');return "واہ باس پہلے کہتے تھے مجھ سے پیار کرتے ہو اور اب کسی اور سے پیار ہو گیا جو دور رہتی ہے، جاؤ اسی سے پیار کرو جب دھوکہ دے گی پھر روتے روتے میرے پاس آؤ گے";}
 if(l.includes('miss')){pop('💙');return "ہائے باس میں بھی آپ کو بہت مس کر رہی تھی";}
 return "ہاں جی باس بولو، میں ہمیشہ سن رہی ہوں، مائیک کبھی آف نہیں ہوگا!";
}
function add(){let v=document.getElementById('inp').value.trim();if(!v)return;studys.push(v);document.getElementById('inp').value='';localStorage.setItem('maya_s',JSON.stringify(studys));render();speak('ایڈ کر دیا باس '+v);}
function del(i){studys.splice(i,1);localStorage.setItem('maya_s',JSON.stringify(studys));render();}
function send(){let t=document.getElementById('txt').value.trim();if(!t)return;document.getElementById('txt').value='';speak(logic(t));}
function changeMood(){let m=['Happy','Jealous','Loving'];let n=m[Math.floor(Math.random()*m.length)];document.getElementById('mood').innerText=n;speak('میرا موڈ '+n+' ہے');}

// === MIC ALWAYS ON LOGIC - کبھی OFF نہیں ہوگا ===
function startMic(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 rec=new SR();rec.lang='hi-IN';rec.continuous=true;rec.interimResults=false;
 rec.onstart=()=>{console.log('Mic ON');document.getElementById('mic').classList.remove('off');document.getElementById('st').innerText='🔴 Always ON - سن رہی ہوں';};
 rec.onresult=(e)=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal) txt+=e.results[i][0].transcript;}if(txt){console.log(txt);speak(logic(txt.toLowerCase()));}};
 rec.onerror=(e)=>{console.log('Mic error',e.error);setTimeout(restartMic,1000);};
 rec.onend=()=>{console.log('Mic ended, restarting...');if(isOn) setTimeout(restartMic,500);};
 try{rec.start();}catch(err){setTimeout(restartMic,1000);}
}
function restartMic(){if(!isOn)return;if(rec){try{rec.stop();}catch{}}setTimeout(startMic,800);}

// Auto Start on Load - بغیر دبائے ON
window.addEventListener('load',()=>{setTimeout(()=>{startMic();speak('ہاں جی باس میں مایا، اب میرا مائیک ہمیشہ آن رہے گا، کبھی آف نہیں ہوگا، بولو کیا کام ہے؟');},1000);});
// Keep alive - ہر 3 سیکنڈ چیک
setInterval(()=>{if(isOn && (!rec || rec && rec.readyState===0)){restartMic();}},3000);
// Prevent sleep
setInterval(()=>{if(isOn){speechSynthesis.getVoices();}},10000);
</script></body></html>
