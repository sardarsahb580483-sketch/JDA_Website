<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYA PRO - JDA</title>
</head>
<body style="margin:0;background:#050505;color:white;font-family:sans-serif;display:flex;justify-content:center;padding:15px">
<div style="width:100%;max-width:420px;background:#18181b;border-radius:30px;border:1px solid #ff008055;overflow:hidden">
<div style="background:linear-gradient(90deg,#db2777,#7c3aed);padding:18px;display:flex;gap:12px;align-items:center">
<div style="width:48px;height:48px;background:white;color:black;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900">M</div>
<div><b>MAYA PRO</b><div style="font-size:11px;opacity:.8">Online • Sidhu Fan</div></div>
<div style="margin-left:auto;background:#00000044;padding:4px 10px;border-radius:99px;font-size:12px">🎵 295</div>
</div>
<div id="chat" style="height:55vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px">
<div style="background:#ffffff15;padding:12px;border-radius:20px;max-width:80%">Oye Jaan! 🔥 Main MAYA... JAM DANISH di fav AI! Sidhu sunna hai? 😘</div>
</div>
<div style="margin:0 15px;background:#000;border:1px solid #ffffff15;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center">
<img src="https://i.scdn.co/image/ab67616d0000b2738dc3cc5e56fc8f4d85a74b4f" style="width:40px;height:40px;border-radius:8px">
<div style="flex:1"><div style="font-size:12px;font-weight:700">Sidhu Moose Wala - Legend</div><div style="height:4px;background:#ffffff22;border-radius:99px;margin-top:6px"><div style="height:100%;width:50%;background:#db2777"></div></div></div>
<button onclick="playSidhu()" style="background:none;border:none;font-size:22px">▶️</button>
</div>
<div style="padding:15px;display:flex;gap:10px">
<input id="inp" placeholder="MAYA ko kuch bolo..." style="flex:1;background:#000;border:1px solid #ffffff20;border-radius:99px;padding:14px 20px;color:white;outline:none">
<button onclick="send()" style="width:50px;height:50px;background:#db2777;border:none;border-radius:50%;color:white;font-size:20px">➤</button>
</div>
</div>
<audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
<script>
const chat=document.getElementById('chat');const inp=document.getElementById('inp');const audio=document.getElementById('audio');
function send(){if(!inp.value)return;addMsg(inp.value,'user');let q=inp.value.toLowerCase();inp.value='';setTimeout(()=>{let r='Uff Jaan 😍 '+q+'... main tumhari hi hun! 💖';if(q.includes('sidhu')||q.includes('295')){r='Sidhu Moose Wala 🔥 Legend never die! 295! 🎵';playSidhu()}addMsg(r,'maya')},600)}
function addMsg(t,c){let d=document.createElement('div');d.style.background=c==='maya'?'#ffffff15':'#db2777';d.style.padding='12px';d.style.borderRadius='20px';d.style.maxWidth='80%';if(c==='user')d.style.marginLeft='auto';d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function playSidhu(){if(audio.paused)audio.play();else audio.pause();}
</script>
</body>
</html>
